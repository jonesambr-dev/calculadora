
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Médias</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    max-width: 450px;
    width: 100%;
    box-shadow: 0 4px 15px #0002;
}

h1 {
    text-align: center;
    color: #17365d;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #176b45;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #105336;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    background: #edf7f0;
    border-radius: 8px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="container">

<h1>Calculadora de Médias</h1>

<p>Informe suas notas trimestrais:</p>

<label>1º Trimestre — Peso 3</label>
<input type="number" id="nota1" min="0" max="10" step="0.1">

<label>2º Trimestre — Peso 3</label>
<input type="number" id="nota2" min="0" max="10" step="0.1">

<label>3º Trimestre — Peso 4</label>
<input type="number" id="nota3" min="0" max="10" step="0.1">

<button onclick="calcular()">Calcular média</button>

<div id="resultado"></div>

</div>

<script>

function calcular() {

    let campo1 = document.getElementById("nota1").value;
    let campo2 = document.getElementById("nota2").value;
    let campo3 = document.getElementById("nota3").value;

    let resultado = document.getElementById("resultado");

    // Verifica as duas primeiras notas
    if (campo1 === "" || campo2 === "") {
        resultado.innerHTML = "Informe as notas do primeiro e segundo trimestres.";
        return;
    }

    let nota1 = Number(campo1);
    let nota2 = Number(campo2);
    let nota3 = Number(campo3);

    // Validação das notas
    if (
        !Number.isFinite(nota1) ||
        !Number.isFinite(nota2) ||
        (campo3 !== "" && !Number.isFinite(nota3)) ||
        nota1 < 0 || nota1 > 10 ||
        nota2 < 0 || nota2 > 10 ||
        (campo3 !== "" && (nota3 < 0 || nota3 > 10))
    ) {
        resultado.innerHTML = "As notas devem estar entre 0 e 10.";
        return;
    }

    // Média parcial dos dois primeiros trimestres
    let mediaprovisoria = (nota1 * 3 + nota2 * 3) / 6;

    // Nota necessária no terceiro trimestre para média 6
    let nota3necessaria =
        (60 - nota1 * 3 - nota2 * 3) / 4;

    let mensagem = "";

    mensagem += "<h3>Resultado parcial</h3>";

    mensagem += "Média dos dois primeiros trimestres: " +
        mediaprovisoria.toFixed(2) + "<br><br>";

    if (nota3necessaria <= 0) {

        mensagem += "Você já atingiu a pontuação ponderada necessária para média 6.<br>";

    } else if (nota3necessaria <= 10) {

        mensagem += "<strong>Nota necessária no terceiro trimestre: " +
            nota3necessaria.toFixed(2) + "</strong><br>";

    } else {

        mensagem += "<strong>Mesmo tirando 10 no terceiro trimestre, você não atingirá a média 6.</strong><br>";

    }

    // Calcula a média final se a terceira nota foi informada
    if (campo3 !== "") {

        let mediageral =
            (nota1 * 3 + nota2 * 3 + nota3 * 4) / 10;

        mensagem += "<hr>";

        mensagem += "<h2>Média geral final: " +
            mediageral.toFixed(2) + "</h2>";

        if (mediageral >= 6) {

            mensagem += "<h3 style='color:green'>Parabéns! Você está aprovado!</h3>";

        } else {

            mensagem += "<h3 style='color:red'>Nota insuficiente para aprovação.</h3>";

        }
    }

    resultado.innerHTML = mensagem;
}

</script>

</body>
</html>
